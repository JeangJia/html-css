<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文件上传</title>
  <style>
    .upload-area {
      margin: 50px auto;
      width: 400px;
      padding: 40px;
      border: 2px dashed #ccc;
      border-radius: 10px;
      text-align: center;
      color: #666;
      transition: border-color 0.3s;
    }
    .upload-area.active {
      border-color: #007bff;
      background: #f0f8ff;
    }
    .upload-area:hover {
      border-color: #007bff;
      background: #e6f7ff;
    }
    input[type="file"] {
      display: none;
    }
    .file-list {
      margin-top: 20px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="upload-area" id="uploadArea">
    <p>将文件拖拽到此处</p>
    <p>或 <span style="color:#007bff;cursor:pointer">点击选择文件</span></p>
    <input type="file" id="fileInput" multiple>
    <div class="file-list" id="fileList"></div>
  </div>

  <script>
    const area = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');

    // 阻止默认行为
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      area.addEventListener(evt, e => e.preventDefault());
    });

    // 拖拽进入
    area.addEventListener('dragover', () => area.classList.add('active'));
    // 拖拽离开
    area.addEventListener('dragleave', () => area.classList.remove('active'));

    // 释放文件
    area.addEventListener('drop', (e) => {
      area.classList.remove('active');
      fileInput.files = e.dataTransfer.files;
      handleFiles(); // 处理文件
    });

    // 点击触发选择
    area.addEventListener('click', () => fileInput.click());

    // 监听文件选择
    fileInput.addEventListener('change', handleFiles);

    // 文件处理函数
    function handleFiles() {
      const files = fileInput.files;
      fileList.innerHTML = '';

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const div = document.createElement('div');
        div.style.margin = '5px 0';
        div.textContent = `📄 ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
        fileList.appendChild(div);
      }
    }
  </script>
</body>
</html>
